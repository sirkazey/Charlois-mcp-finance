# BASE COMMUNE (et usage Docker Desktop) : un seul service, les connecteurs sont des modules du hub.
# Portainer : utiliser docker-compose.dev.yml (pré-prod, branche dev) ou docker-compose.prod.yml (prod, branche main),
# qui étendent ce fichier. Docker Desktop : copier .env.example en .env puis `docker compose up -d --build`.
services:
  mcp-hub:
    build: ./hub
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-preprod}            # preprod (défaut) ou production : badge ENV du portail et verrous
      LOG_LEVEL: ${LOG_LEVEL:-info}           # debug = trace des appels d'outils
      TZ: ${TZ:-Europe/Paris}                 # heure de la coupure nocturne du cache de structure et de la télémétrie (03:00)
      PUBLIC_URL: ${PUBLIC_URL:?URL publique du hub, ex. http://localhost:8080 ou https://mcp.charlois.fr}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?clé maîtresse AES-256 du store (openssl rand -hex 32)}   # chiffre users.json ; la perdre = jetons illisibles
      TRUST_PROXY: ${TRUST_PROXY:-1}          # nombre de reverse-proxys devant le hub (IP réelle pour la limitation de débit)
      # SSO du portail : vide = pas de SSO (clé créée au premier passage) ; entra = Microsoft Entra ID (OIDC, même application que
      # SharePoint, URI de redirection $PUBLIC_URL/auth/sso/callback, MS_TENANT_ID = GUID de l'annuaire) ; mock = mire du bouchon, interdit en production.
      SSO_MODE: ${SSO_MODE}
      # Salesforce — serveur MCP hébergé "SObject Reads" (Configuration → Serveurs MCP) + External Client App OAuth (scope mcp_api, PKCE),
      # callback = $PUBLIC_URL/auth/salesforce/callback. SF_LOGIN_URL = My Domain de l'org (ou de la sandbox).
      SF_LOGIN_URL: ${SF_LOGIN_URL}
      SF_MCP_URL: ${SF_MCP_URL}
      SF_CLIENT_ID: ${SF_CLIENT_ID}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET}
      SF_SCOPE: ${SF_SCOPE}
      # Sage X3 24R1 — vide = mode simulé (YFAC, YCLIENT, ZVENTE). Callback = $PUBLIC_URL/auth/sagex3/callback
      SAGE_URL: ${SAGE_URL}
      SAGE_FOLDER: ${SAGE_FOLDER}
      SAGE_APIKEY_MODE: ${SAGE_APIKEY_MODE}      # bearer (défaut) ou basic : comment envoyer la clé d'API personnelle
      SAGE_LANG: ${SAGE_LANG}                         # langue des libellés Syracuse ; défaut fr-FR
      SAGE_REPRESENTATIONS: ${SAGE_REPRESENTATIONS}   # représentations exposées ; défaut : 8 standards (BPCUSTOMER, BPSUPPLIER, SINVOICE, PINVOICE, SORDER, PORDER, GACCENTRY, ITMMASTER)
      SAGE_OAUTH_AUTH_URL: ${SAGE_OAUTH_AUTH_URL}
      SAGE_OAUTH_TOKEN_URL: ${SAGE_OAUTH_TOKEN_URL}
      SAGE_OAUTH_USERINFO_URL: ${SAGE_OAUTH_USERINFO_URL}
      SAGE_OAUTH_CLIENT_ID: ${SAGE_OAUTH_CLIENT_ID}
      SAGE_OAUTH_CLIENT_SECRET: ${SAGE_OAUTH_CLIENT_SECRET}
      SAGE_OAUTH_SCOPE: ${SAGE_OAUTH_SCOPE}
      # SharePoint / OneDrive — app Entra ID (permissions déléguées User.Read, Files.Read.All, Sites.Read.All), callback = $PUBLIC_URL/auth/sharepoint/callback
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      SP_SITE: ${SP_SITE}                    # ex. charlois.sharepoint.com:/sites/Finance (vide = OneDrive de l'utilisateur)
      # Dropbox — app Dropbox (scopes lecture), proxy vers le serveur MCP officiel https://mcp.dropbox.com/mcp, callback = $PUBLIC_URL/auth/dropbox/callback
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET}
      # MyReport — proxy MCP distant (HTTP SSE) vers le serveur MCP de votre instance MyReport Server. Vide = simulateur local.
      MYREPORT_MCP_URL: ${MYREPORT_MCP_URL}
      MYREPORT_AUTH_HEADER: ${MYREPORT_AUTH_HEADER}   # défaut Authorization (Bearer <jeton personnel>) ; ex. X-Api-Key
      MYREPORT_TOOLS: ${MYREPORT_TOOLS}               # liste blanche des outils MyReport transférables, ex. liste_indicateurs,valeur_indicateur
      MYREPORT_MAX_PER_MIN: ${MYREPORT_MAX_PER_MIN}   # plafond d'appels sortants vers MyReport (production unique) ; défaut 20, 0 = illimité
      SF_MAX_PER_MIN: ${SF_MAX_PER_MIN}               # plafond d'appels vers le serveur MCP Salesforce (crédits Flex) ; défaut 0 = illimité
      SF_DEFAULT_LIMIT: ${SF_DEFAULT_LIMIT}             # LIMIT ajouté aux SOQL sans borne ; défaut 200, 0 = désactivé
      # Clevoa — télémétrie anonyme quotidienne (version, connecteurs configurés, compteur de requêtes). Vide = désactivée.
      CLEVOA_KEY: ${CLEVOA_KEY}
      CLEVOA_URL: ${CLEVOA_URL}              # défaut https://clevoa.fr/api/v1/telemetry
    volumes:
      - mcp-data:/data   # users.json : jetons OAuth par utilisateur

volumes:
  mcp-data:
