# PRÉ-PRODUCTION — Stack Portainer alimentée par la branche `dev` (Git auto-update).
# Étend docker-compose.yml (base commune) : logs détaillés, simulateurs Sage X3 et MyReport par défaut si les URL sont vides,
# télémétrie vers l'URL Clevoa de votre choix (vide = désactivée). Portainer : compose path = docker-compose.dev.yml.
services:
  mcp-hub:
    extends:
      file: docker-compose.yml
      service: mcp-hub
    container_name: mcp-hub-preprod
    environment:
      APP_ENV: preprod
      LOG_LEVEL: debug                       # trace chaque appel d'outil (nom, durée, succès) ; jamais les arguments ni les résultats
      PUBLIC_URL: ${PUBLIC_URL:?ex. https://mcp-preprod.charlois.fr}
      SAGE_URL: ${SAGE_URL:-}                # vide = simulateur Sage X3 (YFAC, YCLIENT, ZVENTE)
      MYREPORT_MCP_URL: ${MYREPORT_MCP_URL:-} # vide = simulateur MyReport
      CLEVOA_URL: ${CLEVOA_URL:-}            # ex. URL API Gateway du stage dev de clevoa-backend
      CLEVOA_KEY: ${CLEVOA_KEY:-}

volumes:
  mcp-data:
