# PRODUCTION — Stack Portainer alimentée par la branche `main` (Git auto-update, après validation des tests).
# Étend docker-compose.yml (base commune) avec les verrous maximaux : télémétrie figée sur l'URL Clevoa de production,
# conteneur sans privilèges, système de fichiers en lecture seule, journalisation plafonnée, store chiffré (ENCRYPTION_KEY).
# Portainer : compose path = docker-compose.prod.yml. Le hub refuse de démarrer si PUBLIC_URL n'est pas en https.
services:
  mcp-hub:
    extends:
      file: docker-compose.yml
      service: mcp-hub
    container_name: mcp-hub-prod
    environment:
      APP_ENV: production                    # badge « ENV: PRODUCTION », mode démo désactivé, https obligatoire
      LOG_LEVEL: info
      PUBLIC_URL: ${PUBLIC_URL:?URL https publique de production, ex. https://mcp.charlois.fr}
      CLEVOA_URL: https://clevoa.fr/api/v1/telemetry
      CLEVOA_KEY: ${CLEVOA_KEY:?clé de licence Clevoa requise en production}
    user: "node"                               # processus sans privilèges (déjà imposé par l'image, rappelé ici)
    read_only: true                            # seuls /data (volume, droits 700) et /tmp sont inscriptibles
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Sauvegarde automatique : copie quotidienne de users.json (chiffré) dans BACKUP_DIR sur la machine hôte, rétention BACKUP_KEEP_DAYS jours.
  # Restauration : ops/restore.sh <fichier>. Voir EXPLOITATION.md.
  mcp-backup:
    image: node:22-alpine
    container_name: mcp-backup-prod
    restart: unless-stopped
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - mcp-data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup-loop.sh:/backup-loop.sh:ro
    command: ["sh", "/backup-loop.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Reverse proxy TLS optionnel (profil « proxy » : COMPOSE_PROFILES=proxy, ou docker compose --profile proxy up -d).
  # Certificats fullchain.pem et privkey.pem dans CERTS_DIR ; mettre HUB_PORT=127.0.0.1:8080 pour que le hub ne soit joignable que par nginx.
  nginx:
    image: nginx:1.28-alpine
    container_name: mcp-proxy-prod
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - mcp-hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/mcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-data:
