# Reverse proxy TLS devant le hub MCP Charlois.
# - Conteneur nginx du profil Compose « proxy » : utilisé tel quel (le hub s'appelle mcp-hub sur le réseau Compose).
# - nginx déjà installé sur le serveur : copier dans /etc/nginx/conf.d/mcp.conf, remplacer mcp-hub:8080 par 127.0.0.1:8080
#   (hub publié sur l'adresse locale avec HUB_PORT=127.0.0.1:8080), adapter le chemin des certificats, puis `nginx -t && nginx -s reload`.
# Certificats : fullchain.pem (certificat + chaîne) et privkey.pem (clé privée), délivrés par l'autorité interne ou publique.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  http2 on;                                   # nginx 1.25.1 ou plus récent ; sinon « listen 443 ssl http2; »
  server_name _;                              # le nom est celui du certificat et de PUBLIC_URL
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 2m;                    # le hub refuse déjà les corps > 1 Mo

  location / {
    proxy_pass http://mcp-hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # adresse réelle : le hub la lit (TRUST_PROXY=1)
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;                      # /sse et /mcp sont des flux : jamais tamponnés
    proxy_read_timeout 1h;                    # une session SSE reste ouverte longtemps
    proxy_send_timeout 1h;
  }
}
