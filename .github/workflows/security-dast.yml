name: Security - ZAP baseline (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated demo hub
        run: |
          printf 'PUBLIC_URL=http://localhost:8080\nENCRYPTION_KEY=%s\nAPP_ENV=preprod\n' "$(openssl rand -hex 32)" > .env
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
      - name: ZAP baseline passive scan (no active attacks)
        run: |
          docker run --rm --network host -v "${{ github.workspace }}:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8080 -m 2 -J zap.json -r zap.html -I || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            zap.json
            zap.html
          if-no-files-found: ignore
      - name: Stop demo
        if: always()
        run: docker compose down -v || true
