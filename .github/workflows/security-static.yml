name: Security - static analysis
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    name: Semgrep community rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep:1.146.0 semgrep scan --config p/javascript --config p/nodejs --config p/security-audit --error --json --output /src/semgrep.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.json
          if-no-files-found: ignore
  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
  gitleaks:
    name: Gitleaks history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --exit-code 1 --report-format json --report-path /repo/gitleaks.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks.json
          if-no-files-found: ignore
  trivy:
    name: Trivy dependencies and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy.json
          if-no-files-found: ignore
